# Dogfoods the RU5 estate shape (templates/dependabot/estate-weekly.yml): one
# grouped pull request per week, majors included. ci-templates has no npm
# manifest, so GitHub Actions is its only ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
