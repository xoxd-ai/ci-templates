name: spoke-ci-v4
# Immutable v4 action-fabric contract released under TIN-4249. The release
# publishes workflow source only; consumer adoption, provider convergence, and
# runtime proof remain separately verified product transactions.
#
# GF v4 fork-pilot edge (TIN-4251; operator ruling 2026-09-22). By default the
# action-fabric job admits pushes and pull requests whose head repository is
# the base repository, and nothing else. A caller may name fork owners in
# `fork_owner_allowlist`; a pull request whose head repository owner is one of
# those logins is then admitted as well. Allowlisted fork pull requests run on
# the adopting organization's self-hosted `gf-v4-dispatch` edge with the same
# read-only `contents` token and no secrets; the workflow neither elevates nor
# forwards anything to the fork. Per-fork tenancy and organization-user
# federation refinement is owed by the GF developers under TIN-4251; this
# input is the pilot edge, not that design. The default (empty) keeps every
# non-opted consumer byte-identical in behaviour.

on:
  workflow_call:
    inputs:
      action_name:
        description: Named action from the caller's checked-in .github/lanes.json.
        required: true
        type: string
      fork_owner_allowlist:
        description: >-
          Comma-separated GitHub logins (no whitespace) whose forks may open
          admitted pull requests. Empty (the default) admits no fork.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  action-fabric:
    # Admission: every push; a pull request from the base repository; or a
    # pull request whose head repository owner login is in the caller's
    # comma-separated allowlist. The comma padding makes the match exact per
    # entry (GitHub logins are case-insensitive, and so is contains()).
    if: >-
      ${{
        github.event_name == 'push'
        || (
          github.event_name == 'pull_request'
          && (
            github.event.pull_request.head.repo.full_name == github.repository
            || (
              inputs.fork_owner_allowlist != ''
              && contains(
                format(',{0},', inputs.fork_owner_allowlist),
                format(',{0},', github.event.pull_request.head.repo.owner.login)
              )
            )
          )
        )
      }}
    # Every adopting organization provisions this thin dispatch edge in its
    # own runner group. The edge submits one named action; it is not the
    # execution pool or a Tinyland-owned provider route.
    runs-on: gf-v4-dispatch
    timeout-minutes: 45
    env:
      SOURCE_SHA: '${{ fromJSON(format(''{{"pull_request":"{0}","push":"{1}"}}'', github.event.pull_request.head.sha, github.sha))[github.event_name] }}'
    steps:
      - name: Check out exact admitted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The owner overlay and admission binding identify the exact PR head,
          # never GitHub's synthetic merge commit. Pushes bind github.sha.
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Execute declared Bazel action
        shell: bash
        env:
          ACTION_NAME: ${{ inputs.action_name }}
        run: |
          set -euo pipefail
          /usr/local/bin/gf-action-client run \
            --plan .github/lanes.json \
            --action "$ACTION_NAME" \
            --source-sha "$SOURCE_SHA" \
            --result-dir "$RUNNER_TEMP/gf-action-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ACTION_NAME}"
